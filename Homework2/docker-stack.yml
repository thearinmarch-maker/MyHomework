version: "3.8"
services:
  web:
    image: "$IMAGE_URI"
    ports:
      - "$APP_PORT:80"
    deploy:
      replicas: 2
      placement:
        preferences:
          - spread: node.hostname
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 30s
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        monitor: 15s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
        order: start-first
        monitor: 15s
